["Burnout, compassion fatigue and secondary trauma","Burnout comes from long-term job strain: exhaustion, cynicism and feeling ineffective. Compassion fatigue is a gradual drain of empathy from sustained caregiving. Secondary traumatic stress is trauma-like symptoms after exposure to a student's or family's distress. They overlap, and none is a personal failing."],
["Setting a boundary without guilt","Try: \"I can take this on after the IEP reviews are done. Can we look at the deadline together?\" Name what you can do, not only what you can't. Boundaries protect your quality of teaching."],
["Grounding in 60 seconds (5-4-3-2-1)","Notice 5 things you see, 4 you can touch, 3 you hear, 2 you smell, 1 you taste. Use it after a meltdown or incident, before you walk into the next class."],
["After a hard incident: a 3-step debrief","1. Make sure everyone is safe and you've had water and a pause. 2. Tell one colleague what happened, facts first, feelings second. 3. Record it once, factually, and let it stay at work."],
["Protect your voice and back","Sip water through the day and rest your voice between sessions. When lifting or physically guiding a student, use trained techniques and ask for a second person. Take a movement break at least once every two hours."],
["Vicarious trauma and secondary traumatic stress","Vicarious trauma is a lasting shift in how you see the world after repeatedly engaging with other people's trauma. Secondary traumatic stress is trauma-like symptoms, such as intrusive thoughts or feeling on edge, after exposure to a student's or family's distress. Both are occupational hazards, not personal failings."],["Countertransference and isolation","Countertransference is when a student's or parent's story stirs your own feelings or history, such as over-rescuing or unexplained irritation. Notice it and name it in supervision. Isolation makes it heavier, so find a peer to debrief with."],["Sleep, movement and CPD","Keep a steady sleep and wake time. Move for a few minutes between sessions to offset sedentary routines and physical strain. CPD in behaviour management and trauma-informed care builds confidence and lowers strain."],["Keeping paperwork manageable","Use shared templates for IEPs and progress notes. Batch records into one protected slot a day, and tell your supervisor when documentation is crowding out planning time."]];

b.textContent="Stop";let n=0;const P=[["Breathe in",4,1.25],["Hold",4,1.25],["Breathe out",6,1]];
(function step(i){if(!document.body.contains(o)||i>=15){stopB();if(document.body.contains(o)){o.style.transform="";o.textContent="Well done";b.textContent="Start again"}return}
const p=P[i%3];o.textContent=p[0];o.style.transitionDuration=p[1]+"s";o.style.transform=`scale(${p[2]})`;bt=setTimeout(()=>step(i+1),p[1]*1000)})(0)}
const A={
gp(d){const g=st.g,c=GAME[g.i],ok=d.v===c[1];g.ok+=ok?1:0;c[1]=="D"?g.d++:g.r++;g.fb=(ok?"Yes. ":"Not quite. ")+c[2];g.i++;const y=scrollY;render();scrollTo(0,y);const b=document.querySelector("[data-a=gp],[data-a=greset]");if(b)b.focus({preventScroll:true})},
greset(){st.g=null;const y=scrollY;render();scrollTo(0,y)},
seg(d){st[d.g]=d.k;keep()},
win(){const v=$('#win').value.trim();if(!v)return toast('Write one small win first');S.wins=S.wins||[];S.wins.push({t:Date.now(),x:v.slice(0,140)});save();keep();toast('Added to your jar')},
pull(){const w=S.wins||[];if(!w.length)return;const x=w[Math.floor(Math.random()*w.length)],j=document.querySelector('.jarsvg');if(j){j.classList.remove('shake');void j.getBoundingClientRect();j.classList.add('shake')}
setTimeout(()=>{const p=$('#pull');if(p)p.innerHTML=`<div class='note n-ok' style='margin-top:10px'><b>${dt(x.t)}</b><br>${esc(x.x)}</div>`},j?600:0)},
sg(d){S.sg=S.sg||[];tg(S.sg,d.k);save();keep()},
lead(d){S.lead=S.lead||[];tg(S.lead,d.k);save();keep()},
sr(d){st.sr=+d.i;keep()},
share(d){const l=S.ci.at(-1),q=S.quiz||{},p=S.pulse||{};const t=d.k=='inv'?`I have been using Anchor, a private wellbeing app for special educators: a 2-minute check-in, breathing, a short game and support options. Nothing is stored on a server. Want to try it with me?`:`Anchor summary (anonymous, no names): check-ins done ${S.ci.length}; latest level ${l?level(l.o)[0]:'none'}; quiz ${q.pre??'-'} to ${q.post??'-'} of 5; comfort asking for help ${p.pre??'-'} to ${p.post??'-'}%; pledge ${S.pledge?'signed':'not yet'}.`;$('#msg').value=t;copy(t)},
tick(d){const i=+d.i,x=S.plan.x,j=x.indexOf(i);j<0?x.push(i):x.splice(j,1);save();const y=scrollY;render();scrollTo(0,y)},
go(d){stopB();st.tab=d.t;st.q=null;st.res=null;render()},
sos(){$("#sosl").innerHTML=LINES.map(l=>`<div class="line"><span>${l[0]}</span><a href="tel:${l[2]}">${l[1]}</a></div>`).join("");$("#sos").showModal()},
close(){$("#sos").close()},
start(){st.q={i:0,a:[]};render()},
ans(d){st.q.a[st.q.i]=+d.v;st.q.i++;st.q.i>=10?finish():render()},
back(){st.q.i--;render()},
quit(){st.q=null;render()},
done(){st.res=null;st.tab="home";render()},
breathe,
msg(d){$("#msg").value=MSG[d.k]},
copy(d){const t=$(d.s);if(!t.value.trim())return toast("Nothing to copy yet");copy(t.value)},
wl(){const v=[1,2,3,4].map(i=>$("#w"+i).value);if(v.some(x=>x===""))return toast("Fill in all four numbers");
$("#wlo").value=`Workload snapshot: I currently support ${v[0]} students, with ${v[1]} hours a week of protected planning time. This month I have ${v[2]} IEPs or reports due, and I handled ${v[3]} behaviour incidents this week. I'd like to discuss whether my caseload, planning time and support are sustainable.`},
wipe(){if(confirm("Delete all check-ins, scores and notes from this device? This can't be undone.")){S={ci:[]};try{localStorage.removeItem("anchor")}catch(e){}toast("Data deleted");render()}},
quiz(){const a=QUIZ.map((x,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);return c?+c.value:null});if(a.includes(null))return toast("Answer all five statements");
const sc=a.filter((v,i)=>!!v===QUIZ[i][1]).length;S.quiz=S.quiz||{};S.quiz[S.quiz.pre==null?"pre":"post"]=sc;save();
$("#qr").innerHTML=`<div class="note n-ok" style="margin-top:12px"><b>You scored ${sc}/5.</b><br>${QUIZ.map((x,i)=>!!a[i]===x[1]?"":`Statement ${i+1} is ${x[1]?"true":"false"}. `).join("")||"All correct."}</div>`;const t=$("#qr");t.scrollIntoView({block:"center"})},
pulse(){const v=PULSE.map((x,i)=>{const c=document.querySelector(`input[name=p${i}]:checked`);return c?(x[1]>0?+c.value:4-c.value):null});if(v.includes(null))return toast("Answer all four statements");
const s=Math.round((mean(v)-1)/2*100);S.pulse=S.pulse||{};S.pulse[S.pulse.pre==null?"pre":"post"]=s;save();toast("Saved");render()},
pledge(){S.pledge=Date.now();save();toast("Pledge saved");render()},
fb(){S.fb=$("#fb").value.slice(0,1000);save();toast("Saved")}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
render();
</script>
